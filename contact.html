        <main>
            <div class="contact_main">
                <h1 class="contact_header">
                    Contact form
                </h1>
                <form action="./odbierz.php" method="post">
                    <div>
                        <label for="name">Your name:</label>
                        <input placeholder="Input your name here" id="name" type="text">
                    </div>
                    <div>
                        <label for="surname">Your surname:</label>
                        <input placeholder="Input your surname here" id="surname" type="text">
                    </div>
                    <div>
                        <label for="email">Your email address:</label>
                        <input placeholder="Input your email here" id="email" type="email">
                    </div>
                    <div>
                        <label for="name">Your age:</label>
                        <input placeholder="18" value="18" id="age" type="number" min="13" max="100">
                    </div>
                    <div class="form_radio_container">
                        <div class="form_radio_subcontainer">
                            <label for="male">Male</label>
                            <input id="male" name="gender" value="Male" type="radio">
                        </div>
                        <div class="form_radio_subcontainer">
                            <label for="female">Female</label>
                            <input id="female" name="gender" value="Female" type="radio">
                        </div>
                    </div>
                    <div>
                        <label for="select_field">Reason of form</label>
                        <select id="select_"field" name="select_field">
                            <option value="question">Question</option>
                            <option value="correction">Correction</option>
                            <option value="contact">Contact</option>
                        </select>
                    </div>
                    <div>
                        <label for="add_data">Additional information</label>
                        <textarea id="add_data" placeholder="Place here every single piece of information you find important or necessary for us to know"></textarea>
                    </div>
                    <div>
                        <label for="file_upload">File upload</label>
                        <input id="file_upload" type="file">
                    </div>
                    <div class="form_agreement">
                        <label for="agreement">I confirm that all of the data is correct:</label>
                        <input id="agreement" type="checkbox" value="Agreement">
                    </div>
                    <div class="form_buttons">
                        <button type="submit">
                            Send
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-send preview-icon"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/></svg>
                        </button>
                        <button type="reset">
                            Clear <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-rotate-ccw preview-icon"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                        </button>
                    </div>
                </form>
            </div>
        </main>        
        <footer>
            The form is fully secured and confidential to us.
